[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cross-harness-scaffolder"
version = "0.1.0"
description = "Consensus-hardened scaffolding for using multiple AI coding harnesses to build efficient and scalable code."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Cubiczan" }]
keywords = ["ai", "agents", "coding", "harness", "consensus-hardening"]
dependencies = []

[project.optional-dependencies]
yaml = ["PyYAML>=6.0"]
postgres = ["psycopg[binary]>=3.1"]
cockroach = ["psycopg[binary]>=3.1"]
superserve = []
all = ["PyYAML>=6.0", "psycopg[binary]>=3.1"]

[project.scripts]
chs = "cross_harness_scaffolder.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
